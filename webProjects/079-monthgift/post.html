    <script type="text/javascript">
        //留單相關，看過後請把註解刪掉喔!  -----start
        var dept = "KZ2";
        var seq_no = "0";
        var web_pno = ""; //電腦版pno
        var NList_Type = "5";
        var fromto = "";
        var Gift = "";
        var is_Mobile = "0";

        /*手機板 pno 判斷相關 >> start */
        $(function () {
            if (isMobile()) {
                web_pno = "";  //手機板pno
                is_Mobile = "1";   
            }
        });

        function isMobile() {
            try { document.createEvent("TouchEvent"); return true; }
            catch (e) { return false; }
        }
        /*手機板 pno 判斷相關 >> end*/
        


        function but_send() {
            $('#sBut').hide();

            //下拉選單有不同語系課程時使用，如果沒有要用就刪掉  -----start
            GetPno();
            if (Gift == "") {
                alert('請選擇索取最新課表。');
                $('#sBut').show();
                return false;
            }
            //下拉選單有不同語系課程時使用，如果沒有要用就刪掉  -----end

            var JSonData = {
                "name": $("#name").val(),
                "mobile": $("#mobile").val(),
                "email": $("#email").val(),
                "seq_no": seq_no,
                "dept_no": dept,
                "memo": "體驗完送電子書" + Gift,
                "web_pno": web_pno,
                "fromto": QueryString("fromto") != null ? QueryString("fromto") : fromto,
                "fromurl": document.location.href, 
                "sourceid": QueryString("fc") != null ? QueryString("fc") : "",
                "NList_Type": NList_Type,
                "IsSend": "N",
                "func": "njycooooqj"
            }

            if ($("input[name=per_chk]:checked").length == 0) {
                alert('請勾選同意個資保護聲明。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.name == "" || JSonData.name == "姓 名") {
                alert('請填寫入姓名。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.mobile == "" || JSonData.mobile == "行動電話") {
                alert('請填寫行動電話。');
                $('#sBut').show();
                return false;
            }
            if (isNaN(JSonData.mobile) == true) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.mobile.length != 10) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.email == "" || JSonData.email == "E-Mail") { JSonData.email = "" } else {
                if (JSonData.email.indexOf("@") <= -1) {
                    alert('電子郵件格式錯誤。');
                    $('#sBut').show();
                    return false;
                }
            }
            goSubmit(JSonData, s, f);
        }

        function s(data) {
            if (data[0].result == "1") {
                $("#name").val("");
                $("#mobile").val("");
                $("#sBut").show();
                document.location.href = "/wGuest/loadover.htm";
            } else {
                alert('送出失敗！');
                $("#sBut").show();
            }
        }
        function f(data) {
            alert(data);
            $("#sBut").show();
        }
        //留單相關，看過後請把註解刪掉喔!  -----end

        //下拉選單有不同語系課程時使用，如果沒有要用就刪掉(左SP右PC) -----start
        function GetPno() {
            var select_val = $("#dpGift :selected").val();
            switch (select_val) {
                case "english":
                    web_pno = is_Mobile == "1" ? "113091500002" : "113091500001";
                    Gift = "我想領英語課";
                    break;
                case "japanese":
                    web_pno = is_Mobile == "1" ? "113091500004" : "113091500003";
                    Gift = "我想領日語課";
                    break;
                case "korean":
                    web_pno = is_Mobile == "1" ? "113091500006" : "113091500005";
                    Gift = "我想領韓語課";
                    break;
                case "spanish":
                    web_pno = is_Mobile == "1" ? "113091500008" : "113091500007";
                    Gift = "我想領西語課";
                    break;
                case "french":
                    web_pno = is_Mobile == "1" ? "113091500010" : "113091500009";
                    Gift = "我想領法語課";
                    break;
                case "german":
                    web_pno = is_Mobile == "1" ? "113091500012" : "113091500011";
                    Gift = "我想領德語課";
                    break;
                case "kidsLanguage":
                    web_pno = is_Mobile == "1" ? "113091500014" : "113091500013";
                    Gift = "我想領兒童外語課";
                    break;
                case "kidsCoding":
                    web_pno = is_Mobile == "1" ? "113091500016" : "113091500015";
                    Gift = "我想領兒童程式課";
                    break;
                case "middleClass":
                    web_pno = is_Mobile == "1" ? "113091500018" : "113091500017";
                    Gift = "我想領國中文理課";
                    break;
            }
        }
        //下拉選單有不同語系課程時使用，如果沒有要用就刪掉  -----end
    </script>
