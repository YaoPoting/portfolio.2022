        /*手機板 pno 判斷相關 >> start */
        $(function () {
            if (isMobile()) {
                web_pno = "113071500008";  //手機板pno
                is_Mobile = "1";

        });

        function isMobile() {
            try { document.createEvent("TouchEvent"); return true; }
            catch (e) { return false; }

        /*手機板 pno 判斷相關 >> end*/
        


        function but_send() {
            $('#sBut').hide();

            var JSonData = {
                "name": $("#name").val(),
                "mobile": $("#mobile").val(),
                "email": $("#email").val(),
                "seq_no": seq_no,
                "dept_no": dept,
                "memo": "體驗完送電子書" + Gift,
                "web_pno": web_pno,
                "fromto": QueryString("fromto") != null ? QueryString("fromto") : fromto,
                "fromurl": document.location.href, 
                "sourceid": QueryString("fc") != null ? QueryString("fc") : "",
                "NList_Type": NList_Type,
                "IsSend": "N",
                "func": "njycooooqj"
            }

            if ($("input[name=per_chk]:checked").length == 0) {
                alert('請勾選同意個資保護聲明。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.name == "" || JSonData.name == "姓 名") {
                alert('請填寫入姓名。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.mobile == "" || JSonData.mobile == "行動電話") {
                alert('請填寫行動電話。');
                $('#sBut').show();
                return false;
            }
            if (isNaN(JSonData.mobile) == true) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.mobile.length != 10) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.email == "" || JSonData.email == "E-Mail") { JSonData.email = "" } else {
                if (JSonData.email.indexOf("@") <= -1) {
                    alert('電子郵件格式錯誤。');
                    $('#sBut').show();
                    return false;
                }
            }
            goSubmit(JSonData, s, f);
        }

        function s(data) {
            if (data[0].result == "1") {
                $("#name").val("");
                $("#mobile").val("");
                $("#sBut").show();
                document.location.href = "/wGuest/loadover.htm";
            } else {
                alert('送出失敗！');
                $("#sBut").show();
            }
        }
        function f(data) {
            alert(data);
            $("#sBut").show();
        }
