        function but_send() {
            $('#sBut').hide();

                "name": $("#name").val(),
                "mobile": $("#mobile").val(),
                "email": $("#email").val(),
                "cityno": $("#ddl_city_no :selected").val(),

                "sourceid": QueryString("fc") != null ? QueryString("fc") : "",
                "NList_Type": NList_Type,
                "IsSend": "N",
                "func": "njycooooqj"
            }

            if ($("input[name=classOption]:checked").length == 0) {
                alert("請選擇課程");
                $('#sBut').show();
                return false;
            }

            if ($("input[name=per_chk]:checked").length == 0) {
                alert('請勾選同意個資保護聲明。');
                $('#sBut').show();
                return false;
            }

            if (JSonData.name == "" || JSonData.name == "請輸入姓名") {
                alert('請輸入姓名');
                $('#sBut').show();
                return false;
            }

            if (JSonData.mobile == "" || JSonData.mobile == "請輸入電話") {
                alert('請輸入電話');
                $('#sBut').show();
                return false;
            }

            if (isNaN(JSonData.mobile) == true) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }

            if (JSonData.mobile.length != 10) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }

            if (JSonData.email == "" || JSonData.email == "E-Mail") { JSonData.email = "" } else {
                if (JSonData.email.indexOf("@") <= -1) {

/*
            if (JSonData.cityno == "") {

                return false;

*/
            if (JSonData.yeargap == "年齡區間") {

            }

            // JSonData.memo += JSonData.citynoname;
            JSonData.memo += "，" + JSonData.yeargap;
            goSubmit(JSonData, s, f);
        }
