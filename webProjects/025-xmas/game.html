    <script type="text/javascript">
        //留單相關，看過後請把註解刪掉喔!  -----start
        var dept = "KZ2";
        var seq_no = "0";
        var web_pno = ""; //電腦版pno
        var NList_Type = "5";
        var fromto = "";
        var Gift = "";
        var is_Mobile = "0";

        /*手機板 pno 判斷相關 >> start */
        $(function () {
            if (isMobile()) {
                web_pno = "110035500002";  //手機板pno
                is_Mobile = "1";   
            }
        });

        function isMobile() {
            try { document.createEvent("TouchEvent"); return true; }
            catch (e) { return false; }
        }
        /*手機板 pno 判斷相關 >> end*/
        


        function but_send() {
            $('#sBut').hide();
            //下拉選單有不同語系課程時使用，如果沒有要用就刪掉  -----start
            GetPno();
            if (Gift == "") {
                alert('請選擇索取最新課表。');
                $('#sBut').show();
                return false;
            }
            //下拉選單有不同語系課程時使用，如果沒有要用就刪掉  -----end
            var JSonData = {
                "name": $("#name").val(),
                "mobile": $("#mobile").val(),
                "email": $("#email").val(),
                "seq_no": seq_no,
                "dept_no": dept,
                "memo": "聖誕好禮兌換" + Gift,
                "web_pno": web_pno,
                "fromto": QueryString("fromto") != null ? QueryString("fromto") : fromto,
                "fromurl": document.location.href, 
                "sourceid": QueryString("fc") != null ? QueryString("fc") : "",
                "NList_Type": NList_Type,
                "IsSend": "N",
                "func": "njycooooqj"
            }

            if ($("input[name=per_chk]:checked").length == 0) {
                alert('請勾選同意個資保護聲明。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.name == "" || JSonData.name == "姓 名") {
                alert('請填寫入姓名。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.mobile == "" || JSonData.mobile == "行動電話") {
                alert('請填寫行動電話。');
                $('#sBut').show();
                return false;
            }
            if (isNaN(JSonData.mobile) == true) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.mobile.length != 10) {
                alert('行動電話格式錯誤。');
                $('#sBut').show();
                return false;
            }
            if (JSonData.email == "" || JSonData.email == "E-Mail") { JSonData.email = "" } else {
                if (JSonData.email.indexOf("@") <= -1) {
                    alert('電子郵件格式錯誤。');
                    $('#sBut').show();
                    return false;
                }
            }
            goSubmit(JSonData, s, f);
        }

        function s(data) {
            if (data[0].result == "1") {
                $("#name").val("");
                $("#mobile").val("");
                $("#sBut").show();
                document.location.href = "/wGuest/loadover.htm";
            } else {
                alert('送出失敗！');
                $("#sBut").show();
            }
        }
        function f(data) {
            alert(data);
            $("#sBut").show();
        }
        //留單相關，看過後請把註解刪掉喔!  -----end

        //下拉選單有不同語系課程時使用，如果沒有要用就刪掉  -----start
        function GetPno() {
            var select_val = $("#dpGift :selected").val();
            switch (select_val) {
                case "english":
                    web_pno = is_Mobile == "1" ? "111101500021" : "111101500020";
                    Gift = "英語體驗課+多益必考單字書";
                    break;
                case "japanese":
                    web_pno = is_Mobile == "1" ? "111101500023" : "111101500022";
                    Gift = "日語體驗課+1200堂影音課";
                    break;
                case "korean":
                    web_pno = is_Mobile == "1" ? "111101500025" : "111101500024";
                    Gift = "韓語體驗課+旅遊韓語會話書";
                    break;
                case "spanish":
                    web_pno = is_Mobile == "1" ? "111101500027" : "111101500026";
                    Gift = "西語體驗課+發音學習工具書";
                    break;
                case "french":
                    web_pno = is_Mobile == "1" ? "111101500029" : "111101500028";
                    Gift = "法語體驗課+實用法語旅遊書";
                    break;
                case "german":
                    web_pno = is_Mobile == "1" ? "111101500031" : "111101500030";
                    Gift = "德語體驗課+基礎入門學習書";
                    break;
                case "jrenglish":
                    web_pno = is_Mobile == "1" ? "111101500033" : "111101500032";
                    Gift = "兒童美語課+英語體驗課1堂";
                    break;
                case "jrprogram":
                    web_pno = is_Mobile == "1" ? "111101500035" : "111101500034";
                    Gift = "兒童程式課+程式體驗課1堂";
                    break;
                case "jrhsclclass":
                    web_pno = is_Mobile == "1" ? "111101500037" : "111101500036";
                    Gift = "國中文理課+30天體驗試用";
                    break;
            }
        }
